  code: |
    ---
    name: wiki-reader
    description: Search the shared wiki and answer questions with cited pages
    capabilities:
      - useutils
      - usetools
    mini-a:
      usewiki: true
      wikiaccess: ro
      wikiroot: /path/to/your/wiki
      useplanning: true
      usestream: true
